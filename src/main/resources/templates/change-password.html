<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Change Password</title>
    <link rel="stylesheet" th:href="@{/css/home.css(v='20260424c')}">
</head>
<body class="inner-page">
<nav class="navbar">
    <h2>Secure Bank</h2>
    <div class="nav-links">
        <a th:href="@{/dashboard}">Dashboard</a>
        <a th:href="@{/account}">Account</a>
        <a th:href="@{/transactions}">Transactions</a>
        <form th:action="@{/logout}" method="post" class="logout-form">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
            <button type="submit" class="nav-link-button">Logout</button>
        </form>
    </div>
</nav>

<main class="simple-page">
    <div class="action-page-grid">
        <section class="info-card primary action-intro">
            <p class="eyebrow">Security Control</p>
            <h1>Change Password</h1>
            <p class="subtle">Update your password regularly to keep your banking account protected.</p>
            <div class="mini-points">
                <span>Minimum 8 characters</span>
                <span>Encrypted storage</span>
                <span>Current password required</span>
            </div>
        </section>

        <section class="info-card transfer-card">
            <h2>Update Password</h2>
            <form action="/change-password" method="post" class="transfer-form">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                <label>Current Password</label>
                <input type="password" name="currentPassword" required>
                <label>New Password</label>
                <input type="password" name="newPassword" minlength="8" required>
                <label>Confirm New Password</label>
                <input type="password" name="confirmPassword" required>
                <button type="submit">Save Password</button>
            </form>
            <p class="form-message error" th:if="${error}" th:text="${error}"></p>
            <p class="form-message success" th:if="${success}" th:text="${success}"></p>
        </section>
    </div>
</main>
</body>
</html>
