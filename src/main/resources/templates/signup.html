<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Create Account</title>
    <link rel="stylesheet" th:href="@{/css/style.css(v='20260424c')}">
</head>
<body>

<div class="auth-box">
    <h2>Create Bank Account</h2>

    <form action="/signup" method="post" class="form-grid">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">

        <div class="form-row">
            <input type="text" name="name" placeholder="Full Name" required>
            <input type="text" name="username" placeholder="Username" minlength="4" pattern="[A-Za-z0-9_]+" required>
        </div>

        <div class="form-row">
            <input type="email" name="email" placeholder="Email Address" required>
            <input type="text" name="mobile" placeholder="Mobile Number" minlength="10" maxlength="10" pattern="\d{10}" required>
        </div>

        <div class="form-row">
            <textarea name="address" placeholder="Full Address" required></textarea>
            <input type="text" name="pincode" placeholder="Pin Code" minlength="6" maxlength="6" pattern="\d{6}" required>
        </div>

        <div class="form-row">
            <input type="password" name="password" placeholder="Password" minlength="8" required>
            <input type="password" name="confirmPassword" placeholder="Confirm Password" required>
        </div>

        <button type="submit">Create Account</button>
    </form>
    <p class="form-message error" th:if="${error}" th:text="${error}"></p>
    <p>Already have an account? <a th:href="@{/login}">Login</a></p>
</div>

</body>
</html>
