<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Forgot Password</title>
    <link rel="stylesheet" th:href="@{/css/style.css(v='20260424c')}">
</head>
<body>
<div class="auth-box wide-auth">
    <h2>Recover Access</h2>
    <form action="/forgot-password" method="post" class="form-grid">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
        <input type="text" name="username" placeholder="Username" required>
        <input type="email" name="email" placeholder="Registered Email" required>
        <button type="submit">Verify Identity</button>
    </form>

    <p class="form-message error" th:if="${error}" th:text="${error}"></p>
    <p class="form-message success" th:if="${success}" th:text="${success}"></p>

    <div class="reset-box" th:if="${resetToken}">
        <p>Your demo reset token is ready.</p>
        <a th:href="@{/reset-password(token=${resetToken})}">Open Reset Form</a>
    </div>

    <p><a th:href="@{/login}">Back to login</a></p>
</div>
</body>
</html>
