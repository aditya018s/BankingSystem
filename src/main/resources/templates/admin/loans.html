<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Manage Loans – Admin</title>
  <link rel="stylesheet" th:href="@{/css/home.css(v='20260424c')}">
  <style>
    .admin-table { width:100%;border-collapse:collapse;font-size:14px; }
    .admin-table th { background:linear-gradient(135deg,#16313c,#2b6777);color:white;padding:12px 14px;text-align:left;font-weight:600;font-size:12px;text-transform:uppercase;letter-spacing:.05em; }
    .admin-table td { padding:12px 14px;border-bottom:1px solid #e4eaf1;vertical-align:middle; }
    .admin-table tr:hover td { background:#f7fafc; }
    .badge { display:inline-block;padding:4px 12px;border-radius:999px;font-size:12px;font-weight:700; }
    .badge-PENDING  { background:#fef3c7;color:#92400e; }
    .badge-ACTIVE   { background:#d1fae5;color:#065f46; }
    .badge-REJECTED { background:#fee2e2;color:#991b1b; }
    .badge-CLOSED   { background:#f3f4f6;color:#374151; }
    .btn-approve { background:#d1fae5;color:#065f46;border:none;padding:7px 12px;border-radius:8px;cursor:pointer;font-weight:600;font-size:12px; }
    .btn-reject  { background:#fee2e2;color:#991b1b;border:none;padding:7px 12px;border-radius:8px;cursor:pointer;font-weight:600;font-size:12px; }
    .btn-view    { background:#e0f0ff;color:#1e5fa8;border:none;padding:7px 12px;border-radius:8px;cursor:pointer;font-weight:600;font-size:12px;text-decoration:none;display:inline-block; }
    .mini-input  { padding:6px 10px;border-radius:6px;border:1px solid #cdd5df;font-size:12px;width:110px; }
    .flash-success { background:#d1fae5;color:#065f46;border-radius:10px;padding:12px 18px;margin-bottom:18px;font-weight:600; }
    .flash-error   { background:#fee2e2;color:#991b1b;border-radius:10px;padding:12px 18px;margin-bottom:18px;font-weight:600; }
    .stat-cards { display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:24px; }
    .stat-card { background:white;border-radius:12px;padding:20px;text-align:center; }
    .stat-card .num { font-size:32px;font-weight:900;color:#16313c; }
    .stat-card .lbl { font-size:12px;color:#6b7280;text-transform:uppercase;letter-spacing:.05em;margin-top:4px; }
    .action-cell { display:flex;flex-direction:column;gap:6px; }
    .approve-row { display:flex;gap:6px;align-items:center; }
  </style>
</head>
<body class="inner-page">

<nav class="navbar">
  <h2>🏦 Secure Bank &nbsp;<span style="font-size:13px;opacity:.7;font-weight:400">Admin Panel</span></h2>
  <div class="nav-links">
    <a th:href="@{/admin/dashboard}">Dashboard</a>
    <a th:href="@{/admin/users}">Users</a>
    <a th:href="@{/admin/transactions}">Transactions</a>
    <a th:href="@{/admin/loans}" class="nav-active">Loans</a>
    <form th:action="@{/logout}" method="post" class="logout-form">
      <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
      <button type="submit" class="nav-link-button logout-btn">Logout</button>
    </form>
  </div>
</nav>

<main class="dashboard-page">

  <div class="section-head">
    <div>
      <p class="eyebrow">Admin Panel</p>
      <h1 style="margin:4px 0">Manage Loans</h1>
    </div>
  </div>

  <div class="flash-success" th:if="${success}" th:text="${success}"></div>
  <div class="flash-error"   th:if="${error}"   th:text="${error}"></div>

  <!-- Stats -->
  <div class="stat-cards">
    <div class="stat-card">
      <div class="num" style="color:#f59e0b" th:text="${pending}">0</div>
      <div class="lbl">Pending</div>
    </div>
    <div class="stat-card">
      <div class="num" style="color:#10b981" th:text="${active}">0</div>
      <div class="lbl">Active</div>
    </div>
    <div class="stat-card">
      <div class="num" style="color:#6b7280" th:text="${closed}">0</div>
      <div class="lbl">Closed</div>
    </div>
    <div class="stat-card">
      <div class="num" style="color:#ef4444" th:text="${rejected}">0</div>
      <div class="lbl">Rejected</div>
    </div>
  </div>

  <div class="info-card" style="padding:0;overflow:hidden">
    <table class="admin-table">
      <thead>
      <tr>
        <th>Loan #</th>
        <th>User</th>
        <th>Amount</th>
        <th>EMI</th>
        <th>Tenure</th>
        <th>Purpose</th>
        <th>Status</th>
        <th>Applied</th>
        <th>EMI Payments</th>
        <th>Actions</th>
      </tr>
      </thead>
      <tbody>
      <tr th:if="${#lists.isEmpty(loans)}">
        <td colspan="10" style="text-align:center;padding:30px;color:#6b7280">
          No loan applications yet.
        </td>
      </tr>
      <tr th:each="loan : ${loans}">
        <td><strong th:text="${loan.loanNumber}"></strong></td>
        <td>
          <strong th:text="${loan.user.name}"></strong><br>
          <span style="color:#6b7280;font-size:12px" th:text="'@' + ${loan.user.username}"></span>
        </td>
        <td><strong th:text="'₹' + ${#numbers.formatDecimal(loan.amount,1,'COMMA',2,'POINT')}"></strong></td>
        <td th:text="'₹' + ${#numbers.formatDecimal(loan.emiAmount,1,'COMMA',2,'POINT')}"></td>
        <td th:text="${loan.tenureMonths} + ' mo'"></td>
        <td th:text="${loan.purpose}"></td>
        <td>
                        <span class="badge"
                              th:classappend="'badge-' + ${loan.status.name()}"
                              th:text="${loan.status}"></span>
        </td>
        <td th:text="${#temporals.format(loan.appliedAt,'dd MMM yyyy')}"></td>

        <!-- Feature 2: View EMI Payments -->
        <td>
          <a th:href="@{/admin/loans/{id}/payments(id=${loan.id})}"
             class="btn-view">
            📋 View EMIs
          </a>
          <br>
          <span style="font-size:11px;color:#6b7280;margin-top:4px;display:block"
                th:text="'Remaining: ₹' + ${#numbers.formatDecimal(loan.remainingAmount,1,'COMMA',2,'POINT')}"></span>
        </td>

        <!-- Approve / Reject / Remark -->
        <td>
          <div class="action-cell" th:if="${loan.status.name() == 'PENDING'}">
            <div class="approve-row">
              <form th:action="@{/admin/loans/{id}/approve(id=${loan.id})}" method="post">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                <input class="mini-input" type="text" name="remark" placeholder="Remark (opt)">
                <button class="btn-approve">✓ Approve</button>
              </form>
            </div>
            <div class="approve-row">
              <form th:action="@{/admin/loans/{id}/reject(id=${loan.id})}" method="post">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                <input class="mini-input" type="text" name="remark" placeholder="Reason">
                <button class="btn-reject">✗ Reject</button>
              </form>
            </div>
          </div>
          <span th:if="${loan.status.name() != 'PENDING'}"
                style="color:#6b7280;font-size:13px"
                th:text="${loan.adminRemark != null ? loan.adminRemark : '—'}"></span>
        </td>
      </tr>
      </tbody>
    </table>
  </div>

</main>
</body>
</html>
