<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Loan EMI Payments – Admin</title>
  <link rel="stylesheet" th:href="@{/css/home.css(v='20260424c')}">
  <style>
    .admin-table { width:100%;border-collapse:collapse;font-size:14px; }
    .admin-table th { background:linear-gradient(135deg,#16313c,#2b6777);color:white;padding:13px 14px;text-align:left;font-weight:600;font-size:12px;text-transform:uppercase;letter-spacing:.05em; }
    .admin-table td { padding:13px 14px;border-bottom:1px solid #e4eaf1;vertical-align:middle; }
    .admin-table tr:hover td { background:#f7fafc; }
    .stat-cards { display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:24px; }
    .stat-card { background:white;border-radius:12px;padding:20px;text-align:center; }
    .stat-card .num { font-size:28px;font-weight:900;color:#16313c; }
    .stat-card .lbl { font-size:12px;color:#6b7280;text-transform:uppercase;letter-spacing:.05em;margin-top:4px; }
    .progress-bar-bg { background:#e5e7eb;border-radius:999px;height:8px;margin:8px 0; }
    .progress-bar { background:linear-gradient(90deg,#10b981,#059669);height:8px;border-radius:999px; }
    .badge-ACTIVE   { background:#d1fae5;color:#065f46;padding:4px 12px;border-radius:999px;font-size:12px;font-weight:700; }
    .badge-CLOSED   { background:#f3f4f6;color:#374151;padding:4px 12px;border-radius:999px;font-size:12px;font-weight:700; }
    .badge-PENDING  { background:#fef3c7;color:#92400e;padding:4px 12px;border-radius:999px;font-size:12px;font-weight:700; }
    .badge-REJECTED { background:#fee2e2;color:#991b1b;padding:4px 12px;border-radius:999px;font-size:12px;font-weight:700; }
  </style>
</head>
<body class="inner-page">

<nav class="navbar">
  <h2>🏦 Secure Bank &nbsp;<span style="font-size:13px;opacity:.7;font-weight:400">Admin Panel</span></h2>
  <div class="nav-links">
    <a th:href="@{/admin/dashboard}">Dashboard</a>
    <a th:href="@{/admin/users}">Users</a>
    <a th:href="@{/admin/transactions}">Transactions</a>
    <a th:href="@{/admin/loans}" class="nav-active">Loans</a>
    <form th:action="@{/logout}" method="post" class="logout-form">
      <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
      <button type="submit" class="nav-link-button logout-btn">Logout</button>
    </form>
  </div>
</nav>

<main class="dashboard-page">

  <div class="section-head">
    <div>
      <p class="eyebrow" th:text="${loan.loanNumber}"></p>
      <h1 style="margin:4px 0" th:text="${loan.user.username} + ' — ' + ${loan.purpose} + ' Loan'"></h1>
    </div>
    <a th:href="@{/admin/loans}" class="count-chip link-chip">← Back to Loans</a>
  </div>

  <!-- Loan summary -->
  <div class="info-card primary" style="margin-bottom:20px">
    <div style="display:flex;justify-content:space-between;flex-wrap:wrap;gap:16px">
      <div>
        <p class="eyebrow">Loan Amount</p>
        <div class="balance-amount">₹<span th:text="${#numbers.formatDecimal(loan.amount,1,'COMMA',2,'POINT')}"></span></div>
        <p class="subtle" th:text="${loan.purpose} + ' · ' + ${loan.tenureMonths} + ' months · ' + ${loan.interestRate} + '% p.a.'"></p>
      </div>
      <div style="text-align:right">
                <span class="badge-ACTIVE" th:classappend="'badge-' + ${loan.status.name()}"
                      th:text="${loan.status}"></span>
        <p style="opacity:.75;font-size:13px;margin-top:8px"
           th:text="'User: ' + ${loan.user.name} + ' (@' + ${loan.user.username} + ')'"></p>
        <p style="opacity:.75;font-size:13px;margin:4px 0"
           th:text="'Email: ' + ${loan.user.email}"></p>
      </div>
    </div>
  </div>

  <!-- Stats -->
  <div class="stat-cards">
    <div class="stat-card">
      <div class="num" th:text="'₹' + ${#numbers.formatDecimal(loan.amount,1,'COMMA',2,'POINT')}"></div>
      <div class="lbl">Principal</div>
    </div>
    <div class="stat-card">
      <div class="num" style="color:#10b981" th:text="'₹' + ${#numbers.formatDecimal(amountPaid,1,'COMMA',2,'POINT')}"></div>
      <div class="lbl">Amount Paid</div>
    </div>
    <div class="stat-card">
      <div class="num" style="color:#ef4444" th:text="'₹' + ${#numbers.formatDecimal(loan.remainingAmount,1,'COMMA',2,'POINT')}"></div>
      <div class="lbl">Remaining</div>
    </div>
    <div class="stat-card">
      <div class="num" th:text="${paidEmis} + '/' + ${loan.tenureMonths}"></div>
      <div class="lbl">EMIs Paid</div>
    </div>
  </div>

  <!-- Progress bar -->
  <div class="info-card" style="margin-bottom:20px" th:if="${loan.totalPayable > 0}">
    <div style="display:flex;justify-content:space-between">
      <p class="eyebrow">Repayment Progress</p>
      <strong style="color:#10b981"
              th:text="${#numbers.formatDecimal(((loan.totalPayable - loan.remainingAmount) / loan.totalPayable) * 100,1,'POINT',1,'POINT')} + '%'"></strong>
    </div>
    <div class="progress-bar-bg">
      <div class="progress-bar"
           th:style="'width:' + ${((loan.totalPayable - loan.remainingAmount) / loan.totalPayable) * 100} + '%'"></div>
    </div>
    <div style="display:flex;justify-content:space-between;font-size:12px;color:#6b7280;margin-top:4px">
      <span th:text="'Monthly EMI: ₹' + ${#numbers.formatDecimal(loan.emiAmount,1,'COMMA',2,'POINT')}"></span>
      <span th:text="${remainingEmis} + ' EMIs remaining'"></span>
    </div>
  </div>

  <!-- EMI Payment History -->
  <div class="info-card" style="padding:0;overflow:hidden">
    <div style="padding:20px 24px;display:flex;justify-content:space-between;align-items:center">
      <div>
        <p class="eyebrow">EMI Records</p>
        <h2 style="margin:4px 0">Payment History</h2>
      </div>
      <span class="count-chip" th:text="${paidEmis} + ' payments'"></span>
    </div>
    <table class="admin-table">
      <thead>
      <tr>
        <th>EMI #</th>
        <th>Amount</th>
        <th>Reference</th>
        <th>Date &amp; Time</th>
      </tr>
      </thead>
      <tbody>
      <tr th:if="${#lists.isEmpty(payments)}">
        <td colspan="4" style="text-align:center;padding:30px;color:#6b7280">
          No payments made yet for this loan.
        </td>
      </tr>
      <tr th:each="p : ${payments}">
        <td><strong th:text="'EMI ' + ${p.emiNumber}"></strong></td>
        <td style="color:#10b981;font-weight:700"
            th:text="'₹' + ${#numbers.formatDecimal(p.amount,1,'COMMA',2,'POINT')}"></td>
        <td style="color:#6b7280;font-size:13px" th:text="${p.referenceNumber}"></td>
        <td th:text="${#temporals.format(p.paidAt,'dd MMM yyyy, HH:mm')}"></td>
      </tr>
      </tbody>
    </table>
  </div>

</main>
</body>
</html>
