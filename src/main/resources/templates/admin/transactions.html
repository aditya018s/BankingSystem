<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>All Transactions – Secure Bank Admin</title>
    <link rel="stylesheet" th:href="@{/css/home.css(v='20260424c')}">
    <style>
        .admin-table { width:100%; border-collapse:collapse; font-size:14px; }
        .admin-table th {
            background: linear-gradient(135deg, #16313c, #2b6777);
            color: white;
            padding: 13px 14px;
            text-align: left;
            font-weight: 600;
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: .05em;
        }
        .admin-table td { padding: 13px 14px; border-bottom: 1px solid #e4eaf1; vertical-align: middle; }
        .admin-table tr:hover td { background: #f7fafc; }

        .type-badge { display:inline-flex; padding:5px 11px; border-radius:999px; font-size:12px; font-weight:700; letter-spacing:.03em; }
        .type-CREDIT       { background:#dcfae6; color:#067647; }
        .type-DEBIT        { background:#fee4e2; color:#b42318; }
        .type-TRANSFER_IN  { background:#e0f0ff; color:#1e5fa8; }
        .type-TRANSFER_OUT { background:#fff3cd; color:#856404; }

        .search-bar { display:flex; gap:12px; margin-bottom:20px; }
        .search-bar input, .search-bar select {
            padding:10px 14px; border-radius:10px; border:1px solid #cdd5df; font-size:14px;
        }
        .search-bar input { flex:1; }
    </style>
</head>
<body class="inner-page">

<!-- ── Navbar ─────────────────────────────────────────────── -->
<nav class="navbar">
    <h2>Secure Bank &nbsp;<span style="font-size:13px;opacity:.7;font-weight:400">Admin Panel</span></h2>
    <div class="nav-links">
        <a th:href="@{/admin/dashboard}">Dashboard</a>
        <a th:href="@{/admin/users}">Users</a>
        <a th:href="@{/admin/transactions}">Transactions</a>
        <a th:href="@{/admin/loans}">Loans</a>
        <form th:action="@{/logout}" method="post" class="logout-form">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
            <button type="submit" class="nav-link-button">Logout</button>
        </form>
    </div>
</nav>

<!-- ── Content ────────────────────────────────────────────── -->
<main class="dashboard-page">

    <div class="section-head">
        <div>
            <p class="eyebrow">Admin Panel</p>
            <h1 style="margin:4px 0">All Transactions</h1>
        </div>
        <a th:href="@{/admin/dashboard}" class="count-chip link-chip">← Back to Dashboard</a>
    </div>

    <!-- Live search filter (client-side) -->
    <div class="search-bar">
        <input type="text" id="searchInput" placeholder="Search by username, reference, or details…"
               oninput="filterTable()">
        <select id="typeFilter" onchange="filterTable()">
            <option value="">All Types</option>
            <option value="CREDIT">Credit</option>
            <option value="DEBIT">Debit</option>
            <option value="TRANSFER_IN">Transfer In</option>
            <option value="TRANSFER_OUT">Transfer Out</option>
        </select>
    </div>

    <div class="info-card" style="padding:0;overflow:hidden">
        <table class="admin-table" id="txTable">
            <thead>
            <tr>
                <th>ID</th>
                <th>User</th>
                <th>Type</th>
                <th>Amount</th>
                <th>Reference</th>
                <th>Details</th>
                <th>Date &amp; Time</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="t : ${transactions}">
                <td th:text="${t.id}"></td>
                <td><strong th:text="${t.user.username}"></strong></td>
                <td>
                        <span class="type-badge"
                              th:classappend="'type-' + ${t.type}"
                              th:text="${t.type}"></span>
                </td>
                <td>
                    <strong th:classappend="${t.type == 'CREDIT' or t.type == 'TRANSFER_IN'} ? 'money-positive' : 'money-negative'"
                            th:text="'₹' + ${#numbers.formatDecimal(t.amount,1,'COMMA',2,'POINT')}"></strong>
                </td>
                <td><span class="table-subtle" th:text="${t.referenceNumber}"></span></td>
                <td th:text="${t.details}"></td>
                <td th:text="${#temporals.format(t.date, 'dd MMM yyyy, HH:mm')}"></td>
            </tr>
            <tr id="noResults" style="display:none">
                <td colspan="7" style="text-align:center;color:#486581;padding:30px">No matching transactions found.</td>
            </tr>
            </tbody>
        </table>
    </div>

</main>

<script>
    function filterTable() {
        const query  = document.getElementById('searchInput').value.toLowerCase();
        const type   = document.getElementById('typeFilter').value.toLowerCase();
        const rows   = document.querySelectorAll('#txTable tbody tr:not(#noResults)');
        let visible  = 0;

        rows.forEach(row => {
            const text     = row.innerText.toLowerCase();
            const typeCell = row.cells[2] ? row.cells[2].innerText.trim().toLowerCase() : '';
            const matchQ   = !query || text.includes(query);
            const matchT   = !type  || typeCell === type;
            row.style.display = (matchQ && matchT) ? '' : 'none';
            if (matchQ && matchT) visible++;
        });

        document.getElementById('noResults').style.display = visible === 0 ? '' : 'none';
    }
</script>

</body>
</html>
