<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Reset Password</title>
    <link rel="stylesheet" th:href="@{/css/style.css(v='20260424c')}">
</head>
<body>
<div class="auth-box wide-auth">
    <h2>Reset Password</h2>
    <form action="/reset-password" method="post" class="form-grid">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
        <input type="hidden" name="token" th:value="${token}">
        <input type="password" name="password" placeholder="New Password" minlength="8" required>
        <input type="password" name="confirmPassword" placeholder="Confirm New Password" required>
        <button type="submit">Update Password</button>
    </form>
    <p class="form-message error" th:if="${error}" th:text="${error}"></p>
    <p><a th:href="@{/login}">Back to login</a></p>
</div>
</body>
</html>
