<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Update Profile</title>
    <link rel="stylesheet" th:href="@{/css/home.css(v='20260424c')}">
</head>
<body class="inner-page">
<nav class="navbar">
    <h2>Secure Bank</h2>
    <div class="nav-links">
        <a th:href="@{/dashboard}">Dashboard</a>
        <a th:href="@{/account}">Account</a>
        <a th:href="@{/change-password}">Password</a>
        <a th:href="@{/transactions}">Transactions</a>
        <form th:action="@{/logout}" method="post" class="logout-form">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
            <button type="submit" class="nav-link-button">Logout</button>
        </form>
    </div>
</nav>

<main class="simple-page">
    <div class="action-page-grid">
        <section class="info-card primary action-intro">
            <p class="eyebrow">Profile Control</p>
            <h1>Update Account Details</h1>
            <p class="subtle">Keep your contact information current so your banking profile stays accurate and trustworthy.</p>
            <div class="mini-points">
                <span th:text="${maskedAccountNumber}"></span>
                <span th:text="${lastLoginDisplay}"></span>
                <span>Profile changes save instantly</span>
            </div>
        </section>

        <section class="info-card">
            <h2>Edit Profile</h2>
            <form action="/update" method="post" class="form-grid profile-form">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                <div class="form-row">
                    <input type="text" name="name" placeholder="Full Name" th:value="${user.name}" required>
                    <input type="email" name="email" placeholder="Email Address" th:value="${user.email}" required>
                </div>

                <div class="form-row">
                    <input type="text" name="mobile" placeholder="Mobile Number" minlength="10" maxlength="10" pattern="\d{10}" th:value="${user.mobile}" required>
                    <input type="text" name="pincode" placeholder="Pin Code" minlength="6" maxlength="6" pattern="\d{6}" th:value="${user.pincode}" required>
                </div>

                <div class="form-row single-column">
                    <textarea name="address" placeholder="Full Address" required th:text="${user.address}"></textarea>
                </div>

                <button type="submit" class="solid-action">Save Changes</button>
            </form>

            <p class="form-message error" th:if="${error}" th:text="${error}"></p>
            <p class="form-message success" th:if="${success}" th:text="${success}"></p>
        </section>
    </div>
</main>
</body>
</html>
