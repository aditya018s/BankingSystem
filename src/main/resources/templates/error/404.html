<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Page Not Found – Secure Bank</title>
    <link rel="stylesheet" th:href="@{/css/home.css(v='20260424c')}">
    <style>
        .error-page {
            min-height: 100vh;
            background: linear-gradient(135deg, #1d4350, #a43931);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: white;
            text-align: center;
            padding: 24px;
        }
        .error-code {
            font-size: 120px;
            font-weight: 900;
            margin: 0;
            opacity: 0.15;
            line-height: 1;
        }
        .error-title {
            font-size: 28px;
            font-weight: 700;
            margin: -30px 0 12px;
        }
        .error-sub {
            opacity: 0.85;
            font-size: 16px;
            max-width: 400px;
            line-height: 1.6;
        }
        .error-actions {
            display: flex;
            gap: 14px;
            margin-top: 32px;
            flex-wrap: wrap;
            justify-content: center;
        }
        .btn-white {
            background: white;
            color: #1d4350;
            border: none;
            border-radius: 999px;
            padding: 13px 26px;
            font-weight: 700;
            font-size: 15px;
            text-decoration: none;
            cursor: pointer;
        }
        .btn-outline {
            background: transparent;
            color: white;
            border: 1px solid rgba(255,255,255,0.6);
            border-radius: 999px;
            padding: 13px 26px;
            font-weight: 600;
            font-size: 15px;
            text-decoration: none;
        }
    </style>
</head>
<body class="inner-page">
<div class="error-page">
    <p class="error-code">404</p>
    <h1 class="error-title">Page Not Found</h1>
    <p class="error-sub">
        The page you're looking for doesn't exist or has been moved.
        Double-check the URL or head back to safety.
    </p>
    <div class="error-actions">
        <a href="/dashboard" class="btn-white">Go to Dashboard</a>
        <a href="/" class="btn-outline">Home</a>
    </div>
</div>
</body>
</html>
