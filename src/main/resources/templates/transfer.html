<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Transfer Money</title>
    <link rel="stylesheet" th:href="@{/css/home.css(v='20260424c')}">
</head>
<body class="inner-page">
<nav class="navbar">
    <h2>🏦 Secure Bank</h2>
    <div class="nav-links">
        <a th:href="@{/dashboard}" class="">Dashboard</a>
        <a th:href="@{/transactions}" class="">Transactions</a>
        <a th:href="@{/loans}" class="">Loans</a>
        <div class="nav-dropdown">
            <div class="nav-dropdown-trigger">More <span class="arrow">▼</span></div>
            <div class="nav-dropdown-menu">
                <a th:href="@{/transfer}"><span class="menu-icon">↔</span> Transfer Money</a>
                <a th:href="@{/credit}"><span class="menu-icon">+</span> Add Money</a>
                <a th:href="@{/debit}"><span class="menu-icon">−</span> Withdraw</a>
                <div class="menu-divider"></div>
                <a th:href="@{/account}"><span class="menu-icon">👤</span> My Account</a>
                <a th:href="@{/balance}"><span class="menu-icon">💰</span> Check Balance</a>
                <a th:href="@{/update}"><span class="menu-icon">✏</span> Update Profile</a>
                <a th:href="@{/change-password}"><span class="menu-icon">🔒</span> Change Password</a>
                <div class="menu-divider"></div>
                <a th:href="@{/loans/calculator}"><span class="menu-icon">🧮</span> EMI Calculator</a>
            </div>
        </div>
        <form th:action="@{/logout}" method="post" class="logout-form">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
            <button type="submit" class="nav-link-button logout-btn">Logout</button>
        </form>
    </div>
</nav>

<main class="simple-page">
    <div class="info-card transfer-card">
        <h2>Transfer Money</h2>

        <form action="/transfer" method="post" class="transfer-form">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
            <label>Receiver Username:</label>
            <input type="text" name="toUser" required>

            <label>Amount:</label>
            <input type="number" name="amount" step="0.01" required>

            <button type="submit">Transfer</button>
        </form>

        <p class="form-message error" th:if="${error}" th:text="${error}"></p>
        <p class="form-message success" th:if="${success}" th:text="${success}"></p>
    </div>
</main>

</body>
</html>
