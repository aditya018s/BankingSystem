<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Login Verification – Secure Bank</title>
  <link rel="stylesheet" th:href="@{/css/home.css(v='20260424c')}">
  <style>
    body { margin:0; background:linear-gradient(135deg,#1d4350,#a43931); min-height:100vh; display:flex; align-items:center; justify-content:center; font-family:Arial,sans-serif; }
    .otp-card { background:white; border-radius:20px; padding:48px 40px; max-width:420px; width:90%; text-align:center; box-shadow:0 20px 60px rgba(0,0,0,0.3); }
    .otp-icon { font-size:56px; margin-bottom:16px; }
    h2 { color:#16313c; margin:0 0 8px; font-size:24px; }
    .subtitle { color:#486581; font-size:14px; margin:0 0 32px; line-height:1.6; }
    .otp-inputs { display:flex; gap:10px; justify-content:center; margin-bottom:20px; }
    .otp-inputs input { width:48px; height:56px; text-align:center; font-size:22px; font-weight:700; border:2px solid #cdd5df; border-radius:12px; color:#16313c; outline:none; transition:border .2s; }
    .otp-inputs input:focus { border-color:#2b6777; box-shadow:0 0 0 3px rgba(43,103,119,.15); }
    .submit-btn { width:100%; padding:14px; background:linear-gradient(135deg,#16313c,#2b6777); color:white; border:none; border-radius:12px; font-size:16px; font-weight:700; cursor:pointer; margin-bottom:16px; transition:opacity .2s; }
    .submit-btn:hover { opacity:.9; }
    .resend-btn { background:none; border:none; color:#2b6777; font-size:14px; cursor:pointer; text-decoration:underline; padding:0; }
    .error-msg   { background:#fee2e2; color:#991b1b; border-radius:8px; padding:10px 16px; font-size:14px; margin-bottom:16px; text-align:left; }
    .success-msg { background:#d1fae5; color:#065f46; border-radius:8px; padding:10px 16px; font-size:14px; margin-bottom:16px; }
    .timer { color:#ef4444; font-size:13px; margin-bottom:16px; font-weight:600; }
    .back-link { display:block; margin-top:16px; color:#486581; font-size:13px; text-decoration:none; }
    .back-link:hover { color:#16313c; }
  </style>
</head>
<body>
<div class="otp-card">
  <div class="otp-icon">🔐</div>
  <h2>Two-Factor Authentication</h2>
  <p class="subtitle">
    For your security, we sent a 6-digit OTP to<br>
    <strong th:text="${maskedEmail}">your email</strong>.<br>
    Enter it below to complete login.
  </p>

  <div class="error-msg"   th:if="${error}"   th:text="${error}"></div>
  <div class="success-msg" th:if="${success}" th:text="${success}"></div>

  <form th:action="@{/verify-login-otp}" method="post" id="otpForm">
    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
    <input type="hidden" name="otp" id="hiddenOtp">

    <div class="otp-inputs">
      <input type="text" maxlength="1" class="otp-digit" inputmode="numeric" autocomplete="one-time-code">
      <input type="text" maxlength="1" class="otp-digit" inputmode="numeric">
      <input type="text" maxlength="1" class="otp-digit" inputmode="numeric">
      <input type="text" maxlength="1" class="otp-digit" inputmode="numeric">
      <input type="text" maxlength="1" class="otp-digit" inputmode="numeric">
      <input type="text" maxlength="1" class="otp-digit" inputmode="numeric">
    </div>

    <p class="timer">OTP expires in <span id="countdown">5:00</span></p>

    <button type="submit" class="submit-btn">Verify &amp; Login</button>
  </form>

  <form th:action="@{/resend-login-otp}" method="post" style="margin-top:8px">
    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
    <p style="color:#486581;font-size:13px;margin:0 0 6px">Didn't receive OTP?</p>
    <button type="submit" class="resend-btn">Resend OTP</button>
  </form>

  <a href="/login" class="back-link">← Back to Login</a>
</div>

<script>
  const digits = document.querySelectorAll('.otp-digit');

  digits.forEach((input, i) => {
      input.addEventListener('input', () => {
          // Only allow digits
          input.value = input.value.replace(/\D/g, '');
          if (input.value && i < digits.length - 1) digits[i + 1].focus();
          updateHidden();
      });
      input.addEventListener('keydown', e => {
          if (e.key === 'Backspace' && !input.value && i > 0) {
              digits[i - 1].focus();
          }
      });
      input.addEventListener('paste', e => {
          e.preventDefault();
          const pasted = e.clipboardData.getData('text').replace(/\D/g, '').slice(0, 6);
          pasted.split('').forEach((ch, idx) => { if (digits[idx]) digits[idx].value = ch; });
          updateHidden();
          const nextEmpty = Math.min(pasted.length, digits.length - 1);
          digits[nextEmpty].focus();
      });
  });

  function updateHidden() {
      document.getElementById('hiddenOtp').value =
          Array.from(digits).map(d => d.value).join('');
  }

  document.getElementById('otpForm').addEventListener('submit', e => {
      updateHidden();
      const otp = document.getElementById('hiddenOtp').value;
      if (otp.length !== 6) {
          e.preventDefault();
          alert('Please enter all 6 digits');
      }
  });

  // Focus first box
  digits[0].focus();

  // 5 min countdown
  let secs = 300;
  const el = document.getElementById('countdown');
  const iv = setInterval(() => {
      secs--;
      if (secs <= 0) {
          clearInterval(iv);
          el.textContent = 'Expired — please resend';
          el.style.color = '#dc2626';
          return;
      }
      const m = Math.floor(secs / 60), s = secs % 60;
      el.textContent = m + ':' + String(s).padStart(2, '0');
  }, 1000);
</script>
</body>
</html>
