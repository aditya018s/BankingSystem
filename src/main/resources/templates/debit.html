<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Withdraw Money</title>
    <link rel="stylesheet" th:href="@{/css/home.css(v='20260424c')}">
</head>
<body class="inner-page">
<nav class="navbar">
    <h2>Secure Bank</h2>
    <div class="nav-links">
        <a th:href="@{/dashboard}">Dashboard</a>
        <a th:href="@{/transactions}">Transactions</a>
        <a th:href="@{/transfer}">Transfer</a>
        <a th:href="@{/change-password}">Password</a>
        <form th:action="@{/logout}" method="post" class="logout-form">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
            <button type="submit" class="nav-link-button">Logout</button>
        </form>
    </div>
</nav>

<main class="simple-page">
    <div class="action-page-grid">
        <section class="info-card primary action-intro">
            <p class="eyebrow">Withdraw Funds</p>
            <h1>Debit Balance</h1>
            <p class="subtle">Use this page to simulate withdrawals and test insufficient-balance handling in your banking flow.</p>
            <div class="mini-points">
                <span>Checks available balance</span>
                <span>Records debit history</span>
                <span>Works with secure session</span>
            </div>
        </section>

        <section class="info-card transfer-card">
            <h2>Withdraw Amount</h2>
            <form action="/debit" method="post" class="transfer-form">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                <label>Amount</label>
                <input type="number" name="amount" min="1" step="0.01" placeholder="Enter amount" required>
                <button type="submit">Withdraw</button>
            </form>

            <p class="form-message error" th:if="${error}" th:text="${error}"></p>
            <p class="form-message success" th:if="${success}" th:text="${success}"></p>
        </section>
    </div>
</main>
</body>
</html>
