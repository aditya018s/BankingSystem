<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Balance</title>
    <link rel="stylesheet" th:href="@{/css/home.css(v='20260424c')}">
</head>
<body class="inner-page">
<nav class="navbar">
    <h2>Secure Bank</h2>
    <div class="nav-links">
        <a th:href="@{/dashboard}">Dashboard</a>
        <a th:href="@{/transactions}">Transactions</a>
        <a th:href="@{/change-password}">Password</a>
        <form th:action="@{/logout}" method="post" class="logout-form">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
            <button type="submit" class="nav-link-button">Logout</button>
        </form>
    </div>
</nav>

<main class="simple-page">
    <div class="info-card primary centered-card">
        <p class="eyebrow">Available Balance</p>
        <h2>Rs <span th:text="${balance}"></span></h2>
    </div>
</main>
</body>
</html>
